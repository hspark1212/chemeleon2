[project]
name = "csun"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "xtalmet==1.0.0a2",
    "ipykernel",
    "seaborn",
    "mp_api",
    "tabulate",
    "colorama",
    "pymatviz",
    "plotly<6.0.0",
    "huggingface_hub",
]

[tool.ruff]
line-length = 88
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "F", # flake8
    "E", # pycodestyle
    "W", # pycodestyle
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
    "D", # pydocstyle
]
ignore = ["E101", "E501", "W191", "E111", "E114", "E117", "D206", "D300"]
fixable = ["ALL"]
pycodestyle.max-doc-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
